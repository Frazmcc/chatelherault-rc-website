name: Security and API validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/github-audit-2026-10-23]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --no-fund
      - run: node --input-type=module --check < functions/_lib/login-rate-limit.js
      - run: node --input-type=module --check < functions/api/login.js
      - run: node --test tests/login-rate-limit.test.mjs
      - run: npm run verify
      - run: npm audit --audit-level=low
