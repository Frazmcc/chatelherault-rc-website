name: Repair npm lockfile (temporary)
on:
  push:
    branches: [security/github-audit-2026-10-23]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Fix and verify compatible npm security updates
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --no-fund
          npm ci --no-fund
          npm run verify
          npm audit --audit-level=low
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json package.json
          if ! git diff --cached --quiet; then
            git commit -m 'security: update vulnerable transitive packages'
            git push origin HEAD:security/github-audit-2026-10-23
          fi
