<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="RC crawler climbing rocky terrain at sunset">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2a3a"/>
      <stop offset="45%" stop-color="#2b3f52"/>
      <stop offset="100%" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb35c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6a3d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="terrain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3c4b52"/>
      <stop offset="100%" stop-color="#202b31"/>
    </linearGradient>
    <linearGradient id="terrainHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f8f95" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7f8f95" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="wheelRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#87979e"/>
      <stop offset="100%" stop-color="#27343b"/>
    </radialGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence baseFrequency="0.85" numOctaves="2" seed="14" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <ellipse cx="1430" cy="270" rx="520" ry="320" fill="url(#sunset)"/>

  <path d="M0 700 L250 640 L430 670 L620 590 L860 650 L1070 560 L1260 610 L1430 520 L1650 575 L1920 500 L1920 1080 L0 1080 Z" fill="url(#terrain)"/>
  <path d="M0 760 L190 710 L390 730 L620 680 L840 740 L1030 690 L1240 725 L1490 665 L1720 700 L1920 660 L1920 1080 L0 1080 Z" fill="#1a232a"/>
  <path d="M120 694 L400 655 L730 615 L980 586 L1330 552" stroke="url(#terrainHighlight)" stroke-width="28" stroke-linecap="round" fill="none"/>

  <g filter="url(#shadow)">
    <path d="M690 610 L810 560 L965 566 L1125 615 L1080 670 L765 670 Z" fill="#161f26"/>
    <path d="M760 575 L855 535 L945 538 L1040 575 L1008 616 L792 616 Z" fill="#23303a"/>
    <rect x="840" y="500" width="145" height="54" rx="10" fill="#2b3a44"/>
    <rect x="864" y="510" width="102" height="35" rx="8" fill="#5f737d"/>
    <rect x="876" y="516" width="38" height="22" rx="4" fill="#a1bbc7"/>
    <rect x="924" y="516" width="35" height="22" rx="4" fill="#8ea8b4"/>

    <g>
      <circle cx="798" cy="674" r="66" fill="#0f161b"/>
      <circle cx="798" cy="674" r="50" fill="url(#wheelRim)"/>
      <circle cx="798" cy="674" r="20" fill="#1a252d"/>
    </g>
    <g>
      <circle cx="1040" cy="674" r="66" fill="#0f161b"/>
      <circle cx="1040" cy="674" r="50" fill="url(#wheelRim)"/>
      <circle cx="1040" cy="674" r="20" fill="#1a252d"/>
    </g>
  </g>

  <path d="M0 900 L260 870 L520 905 L830 860 L1070 910 L1360 865 L1670 900 L1920 860 L1920 1080 L0 1080 Z" fill="#10171d"/>
  <rect width="1920" height="1080" filter="url(#grain)"/>
</svg>
